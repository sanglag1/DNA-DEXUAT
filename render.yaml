# Cấu hình triển khai lên Render.com (Blueprint)
#
# Cách dùng: vào https://dashboard.render.com/blueprints -> New Blueprint Instance
# -> chọn repo này. Render đọc file này và tự dựng 2 thành phần bên dưới.
#
# CẢNH BÁO VỀ GÓI MIỄN PHÍ (đọc kỹ trước khi dùng cho việc thật):
#   - Web service ngủ sau 15 phút không ai truy cập, lần vào lại mất ~1 phút khởi động.
#   - Chỉ 512MB RAM và CPU dùng chung -> phần TÍNH TOÁN TỐI ƯU sẽ chậm hơn nhiều lần
#     so với chạy trên máy. BOM nhiều cỡ đoạn nhiều khả năng chạy không nổi.
#     Dùng để DEMO giao diện và BOM nhỏ; việc thật nên dùng gói trả phí hoặc server riêng.
#
# KHÔNG có Postgres (2026-09-03): toàn bộ @login_required đã gỡ khỏi cat_sat/cat_laser_roi/
# optimization_logs (accounts + admin Django không còn ai dùng), nên không còn lý do cần DB thật -
# settings.py tự fallback sang SQLite cục bộ khi thiếu DB_HOST. LƯU Ý: SQLite này KHÔNG bền qua
# redeploy/restart (Render không có ổ đĩa lâu dài ở gói free/service này) - chấp nhận được vì
# OptimizationLog/cat_sat.Solution vốn chưa từng được code nào ghi vào (đã xác nhận qua audit,
# 2 model này là "code chết"), và không còn ai cần đăng nhập để tồn tại qua các lần redeploy.

services:
  # Redis — dùng cho Django Channels (WebSocket của màn MC Laser)
  - name: dna-dexuat-redis
    type: keyvalue
    plan: free
    ipAllowList: []          # rỗng = chỉ cho truy cập nội bộ trong Render

  - name: dna-dexuat
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    region: singapore        # gần Việt Nam nhất
    healthCheckPath: /        # trước là /accounts/login/ - giờ không cần đăng nhập, redirect thẳng vào cat_laser_roi:index
    envVars:
      # Django tự sinh khoá bí mật, không cần điền tay
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Render cấp tên miền dạng *.onrender.com
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # CPU dùng chung -> ít luồng lại nhanh hơn nhiều luồng tranh nhau
      - key: SOLVER_WORKERS
        value: "2"
      # Khoá xác thực request từ DNA-ERP-BE (api/views.py::require_api_key, fail-closed nếu rỗng).
      # sync: false -> Render KHÔNG tự sinh, KHÔNG lưu vào file này - phải tự điền tay trong
      # Dashboard > service này > Environment sau khi Blueprint tạo xong. PHẢI khớp 100% với
      # SOLVER_API_KEY trong .env của DNA-ERP-BE (môi trường đang trỏ vào service này), nếu không
      # mọi request "Đề xuất cắt sắt" từ BE sẽ luôn nhận 401.
      - key: ERP_API_KEY
        sync: false

      # --- Redis: Render trả về URL đầy đủ, settings.py đã hỗ trợ REDIS_URL ---
      - key: REDIS_URL
        fromService:
          name: dna-dexuat-redis
          type: keyvalue
          property: connectionString
